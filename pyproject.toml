[project]
name = "c12_callisto_clients"
version = "2.1.12"
description = "Different adapters for the access to the C12 Callisto quantum emulator."
authors = [{name = "C12 Quantum Electronics", email = "dev@c12qe.com"}]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<3.12"
keywords = ["quantum", "emulator", "c12", "callisto", "clients", "pytket"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic-settings>=2.10",
    "requests>=2.32",
    "traitlets>=5.14",
    "pydantic>=2.9",
    "qiskit>=1.4, <1.5",
    "pytket>=1.33,<1.34",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.4, <1.5"]
pytket = ["pytket>=1.33,<1.34"]
all = ["qiskit>=1.4, <1.5", "pytket>=1.33,<1.34"]
dev = [
    "pytest>=7.1.1",
]

[project.urls]
Homepage = "https://www.c12qe.com"
Repository = "https://github.com/c12qe/c12simulator-clients"
Documentation = "https://c12qe.github.io/c12-callisto-clients/"
Issues = "https://github.com/c12qe/c12simulator-clients/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["c12_callisto_clients*"]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "*_test.py"
pythonpath = "src"