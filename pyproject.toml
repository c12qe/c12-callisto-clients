[project]
name = "c12_callisto_clients"
version = "2.1.12"
description = "Different adapters for the access to the C12 Callisto quantum emulator."
authors = [{ name = "C12 Quantum Electronics", email = "dev@c12qe.com" }]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = { text = "Proprietary" }
keywords = [
    "quantum",
    "emulator",
    "c12",
    "callisto",
    "clients",
    "pytket",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic-settings>=2.10",
    "requests>=2.32",
    "traitlets>=5.14",
    "pydantic>=2.9",
    "qiskit>=1.4, <1.5",
    "pytket>=1.33,<1.34",
    "urllib3 (==2.6.3)",
]


[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.15.20",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.4, <1.5"]
pytket = ["pytket>=1.33,<1.34"]
all = [
    "qiskit>=1.4, <1.5",
    "pytket>=1.33,<1.34",
]
dev = ["pytest>=7.1.1"]

[project.urls]
Homepage = "https://www.c12qe.com"
Repository = "https://github.com/c12qe/c12simulator-clients"
Documentation = "https://c12qe.github.io/c12-callisto-clients/"
Issues = "https://github.com/c12qe/c12simulator-clients/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["c12_callisto_clients*"]
exclude = ["tests*"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "*_test.py"
pythonpath = "src"

[tool.pyright]
exclude = ["*.ipynb"]
include = ["src/c12_callisto_clients"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    "*.ipynb"
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort (import sorting)
    "N", # pep8-naming
    "UP", # pyupgradeclear
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Allow assert in tests
    "ARG", # Allow unused arguments in test fixtures
    "ANN", # Don't require annotations in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
