name: Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format
        # Useful if linter failed, we still want to check formatter
        if: always()
        run: uv run ruff format . --check

  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run pyright
        run: uv run pyright

  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run tests
        run: uv run pytest tests